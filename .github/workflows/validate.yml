name: Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [dev, prod]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: environments/${{ matrix.environment }}
        run: |
          terraform init -backend=false

      - name: Terraform validate
        working-directory: environments/${{ matrix.environment }}
        env:
          TF_VAR_dt_env_url: "https://dummy.live.dynatrace.com"
          TF_VAR_dt_api_token: "dt0c01.dummy.dummy"
          TF_VAR_app_name: "test-app"
          TF_VAR_team: "platform"
          TF_VAR_slack_webhook_p1: "https://hooks.slack.com/dummy"
          TF_VAR_slack_webhook_p2: "https://hooks.slack.com/dummy"
          TF_VAR_pagerduty_api_key: "dummy"
          TF_VAR_services: '{"api":{"entity_id":"SERVICE-DUMMY","response_time_threshold_ms":1000,"error_rate_threshold_percent":5}}'
        run: terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@v4

      - name: tflint init
        working-directory: environments/${{ matrix.environment }}
        run: tflint --init

      - name: tflint run
        working-directory: environments/${{ matrix.environment }}
        run: tflint
